name: Daily YouTube Shorts Automation

on:
  schedule:
    # Runs daily at 08:00 UTC (adjust to your preferred time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Specific YouTube URL (leave blank to read Google Sheet)'
        required: false
        default: ''
      auto_approve:
        description: 'Auto-approve shorts without waiting for messaging response'
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore credentials from Secrets
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YT_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "$GOOGLE_SA_JSON" ]; then
            echo "$GOOGLE_SA_JSON" > credentials/service_account.json
          fi
          if [ -n "$YT_CLIENT_SECRETS" ]; then
            echo "$YT_CLIENT_SECRETS" > credentials/client_secrets.json
          fi
          if [ -n "$YT_TOKEN_JSON" ]; then
            echo "$YT_TOKEN_JSON" > credentials/youtube_token.json
          fi

      - name: Run Shorts Automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GOOGLE_SHEET_NAME: ${{ vars.GOOGLE_SHEET_NAME || 'YouTube_Videos_Queue' }}
          APPROVAL_PROVIDER: ${{ vars.APPROVAL_PROVIDER || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          CMD="python main.py"
          if [ -n "${{ github.event.inputs.video_url }}" ]; then
            CMD="$CMD --url '${{ github.event.inputs.video_url }}'"
          fi
          if [ "${{ github.event.inputs.auto_approve }}" = "true" ]; then
            CMD="$CMD --auto-approve"
          fi
          eval $CMD
